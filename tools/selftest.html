<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DroneFace self-test</title>
</head>
<body>
<iframe id="f" src="../drone-face.html" style="width:800px;height:600px;border:0"></iframe>
<pre id="out">running…</pre>
<script>
const results = [];
function assert(name, cond, detail) { results.push({ name, pass: !!cond, detail }); }

async function main() {
  const frame = document.getElementById('f');
  await new Promise((res) => {
    const check = () => (frame.contentWindow && frame.contentWindow.__DF) ? res() : setTimeout(check, 10);
    frame.addEventListener('load', check);
    check();
  });
  const w = frame.contentWindow;
  const DF = w.DroneFace, T = w.__DF;
  if (!DF || !T) { assert('app booted (DroneFace + __DF)', false); render(); return; }
  assert('app booted (DroneFace + __DF)', true);

  T.pause(); // stop the app's own rAF; the test drives time deterministically

  // ---- geometry ----
  const counts = T.getCounts();
  assert('total drones ~3,900', counts.total >= 3650 && counts.total <= 4150);
  assert('face + mouth ~3,200', counts.face + counts.mouth >= 2950 && counts.face + counts.mouth <= 3450);
  assert('hair ~700', counts.hair >= 620 && counts.hair <= 800);
  assert('no neck group', counts.neck === 0);
  assert('reserve ~28%', counts.reserve >= counts.total * 0.20 && counts.reserve <= counts.total * 0.38);
  assert('mouth group populated', counts.mouth > 30);
  assert('no NaN in vertex attributes', T.attributeNaNCount() === 0);

  const gs = T.geometryStats();
  assert('nose tip protrudes (z > 0.5)', gs.noseTip.z > 0.5);
  assert('nose tip near centre line (|x| < 0.15)', Math.abs(gs.noseTip.x) < 0.15);
  assert('nose tip below centre (y < -0.2)', gs.noseTip.y < -0.2);
  assert('jaw-drop displacement present', gs.jawDropMax > 0.05);
  assert('blink displacement present', gs.blinkMax > 0.03);
  assert('lid points carry the blink (> 120)', gs.eyeXs.length > 120);
  assert('left eye cluster', gs.eyeXs.filter((x) => x < -0.2).length > 40);
  assert('right eye cluster', gs.eyeXs.filter((x) => x > 0.2).length > 40);

  // ---- state machine ----
  assert('initial state idle', T.getState() === 'idle');
  let stateChanged = false;
  DF.on('stateChange', () => { stateChanged = true; });
  DF.start();
  assert('stateChange event fires', stateChanged);
  assert('start() -> forming', T.getState() === 'forming');
  for (let i = 0; i < 60; i++) T.tick(0.1); // 6 s
  assert('forming completes -> active', T.getState() === 'active');

  // ---- render check: the formed face fills a region, not just two eyes ----
  const rs = T.renderStats();
  assert('formed face renders many points (lit > 5000)', !!(rs && rs.lit > 5000));
  assert('rendered face is horizontally centred', !!(rs && Math.abs(rs.cx - rs.w / 2) < rs.w * 0.25));

  // ---- drag orientation (while ACTIVE) ----
  const canvas = w.document.getElementById('scene');
  const pe = { bubbles: true, cancelable: true, pointerId: 1, isPrimary: true };
  const drag = (x1, y1, x2, y2) => {
    canvas.dispatchEvent(new w.PointerEvent('pointerdown', { ...pe, clientX: x1, clientY: y1 }));
    canvas.dispatchEvent(new w.PointerEvent('pointermove', { ...pe, clientX: x2, clientY: y2 }));
    canvas.dispatchEvent(new w.PointerEvent('pointerup', { ...pe, clientX: x2, clientY: y2 }));
  };
  drag(200, 200, 320, 280); // +120px right, +80px down
  for (let i = 0; i < 40; i++) T.tick(0.05); // 2 s settle
  let o = T.getOrientation();
  assert('drag right -> yaw > 0', o.yaw > 10);
  assert('drag down -> pitch > 0', o.pitch > 5);
  assert('yaw within limit', o.yaw < 34);
  assert('pitch within limit', o.pitch < 24);
  drag(200, 200, 400, 200); // push past the yaw limit
  for (let i = 0; i < 40; i++) T.tick(0.05);
  assert('yaw clamped by rubber band (< 40)', T.getOrientation().yaw < 40);

  // ---- ambient toggle ----
  DF.setAmbient(false);
  assert('setAmbient off', DF.ambient === false);
  DF.setAmbient(true);
  assert('setAmbient on', DF.ambient === true);

  DF.disperse();
  assert('disperse() -> dispersing', T.getState() === 'dispersing');
  for (let i = 0; i < 50; i++) T.tick(0.1); // 5 s
  assert('dispersing completes -> idle', T.getState() === 'idle');

  // ---- 10 disperse/reform cycles stay clean (acceptance #10) ----
  let cyclesOk = true;
  for (let c = 0; c < 10; c++) {
    DF.start();
    for (let i = 0; i < 60; i++) T.tick(0.1);
    if (T.getState() !== 'active') { cyclesOk = false; break; }
    DF.disperse();
    for (let i = 0; i < 50; i++) T.tick(0.1);
    if (T.getState() !== 'idle') { cyclesOk = false; break; }
  }
  assert('10 disperse/reform cycles stay clean', cyclesOk);

  // ---- mouth override ----
  DF.setMouth(0.8, 0.5);
  for (let i = 0; i < 20; i++) T.tick(0.05); // 1 s settle
  let m = T.getMouth();
  assert('setMouth open ~0.8', m.open > 0.65 && m.open < 0.9);
  assert('setMouth width ~0.5', m.width > 0.35 && m.width < 0.65);
  DF.setMouth(0, 0);
  for (let i = 0; i < 20; i++) T.tick(0.05);
  assert('setMouth closes', T.getMouth().open < 0.1);

  // ---- idle motion (spec §9.2): tilt, glance, the other way, 10 s of nothing between ----
  assert('idle motion is on by default', DF.idleMotion === true);
  DF.setIdleMotion(true);
  DF.disperse();
  for (let i = 0; i < 50; i++) T.tick(0.1);   // 5 s, back to idle: the cycle resets
  DF.start();
  for (let i = 0; i < 60; i++) T.tick(0.1);   // 6 s forming, ACTIVE on the last frame
  assert('cycle restarts when the face reforms', T.getIdle().step === 0 && T.getIdle().phase === 'wait');

  // sample the head pose every 50 ms for a minute of waiting
  const series = [];
  for (let i = 0; i < 64 / 0.05; i++) {
    T.tick(0.05);
    const g = T.getIdle();
    series.push([+(i * 0.05).toFixed(2), g.yaw, g.roll]);
  }
  assert('still for the first ten seconds of waiting',
    series.filter(([t]) => t < 9.8).every(([, y, r]) => Math.abs(y) < 0.05 && Math.abs(r) < 0.05),
    JSON.stringify(series.filter(([, y, r]) => Math.abs(y) > 0.05 || Math.abs(r) > 0.05).slice(0, 3)));

  // cut the series into gestures: one starts when an axis passes half a degree, and ends
  // when the head has been back at centre for half a second
  const gestures = [];
  let cur = null, stillFor = 0;
  for (const [t, yaw, roll] of series) {
    const axis = Math.abs(roll) > Math.abs(yaw) ? 'roll' : 'yaw';
    const v = axis === 'roll' ? roll : yaw;
    if (!cur) {
      if (Math.abs(v) > 0.5) cur = { axis, start: t, peak: v, samples: [v], end: t };
    } else if (Math.abs(yaw) < 0.2 && Math.abs(roll) < 0.2) {
      stillFor += 0.05;
      if (stillFor >= 0.5) {
        cur.end = t;
        // the plateau, measured against the peak the gesture actually reached — a running
        // threshold would count the easing-in as holding still
        cur.peak = cur.samples.reduce((a, x) => (Math.abs(x) > Math.abs(a) ? x : a), 0);
        cur.held = cur.samples.filter((x) => Math.abs(x) >= 0.98 * Math.abs(cur.peak)).length * 0.05;
        gestures.push(cur); cur = null; stillFor = 0;
      }
    } else {
      stillFor = 0;
      cur.samples.push(v);
    }
  }
  const describe = () => JSON.stringify(gestures.map((g) => [g.axis, g.peak, +g.held.toFixed(1), +g.start.toFixed(1)]));
  assert('four gestures in a minute of waiting', gestures.length === 4, describe());
  assert('the cycle is tilt, glance, tilt, glance',
    gestures.map((g) => g.axis).join(',') === 'roll,yaw,roll,yaw', describe());
  assert('a tilt never exceeds 4 degrees',
    gestures.filter((g) => g.axis === 'roll').every((g) => Math.abs(g.peak) <= 4), describe());
  assert('a tilt reaches about 3.5 degrees',
    gestures.filter((g) => g.axis === 'roll').every((g) => Math.abs(Math.abs(g.peak) - 3.5) < 0.4), describe());
  assert('a glance is about a third of the turn limit',
    gestures.filter((g) => g.axis === 'yaw').every((g) => Math.abs(Math.abs(g.peak) - 12) < 0.8), describe());
  assert('one way, then the other',
    gestures.every((g, i) => Math.sign(g.peak) === (i < 2 ? -1 : 1)), describe());
  assert('holds each pose (3 s tilt, 2 s glance)',
    Math.abs(gestures[0].held - 3) < 0.7 && Math.abs(gestures[1].held - 2) < 0.7 &&
    Math.abs(gestures[2].held - 3) < 0.7 && Math.abs(gestures[3].held - 2) < 0.7, describe());
  const gaps = gestures.slice(1).map((g, i) => +(g.start - gestures[i].end).toFixed(2));
  assert('about 10 s of nothing between gestures',
    gaps.length === 3 && gaps.every((x) => Math.abs(x - 10) < 1.5), JSON.stringify(gaps));

  // speaking must stop the cycle, not just pause the gesture it is in the middle of
  DF.setEndpoint('http://127.0.0.1:1/tts');
  DF.speak('waiting on audio that cannot arrive, so the fallback holds the face busy');
  const nap = (ms) => new Promise((res) => setTimeout(res, ms));
  for (let i = 0; i < 40 && DF.voiceStatus().synthVoice !== true; i++) { T.tick(0.05); await nap(50); }
  assert('the fallback engaged (speaking face)', DF.voiceStatus().synthVoice === true, JSON.stringify(DF.voiceStatus()));
  for (let i = 0; i < 24 / 0.05; i++) T.tick(0.05);   // 24 s of waiting, with voice playing
  const spoke = T.getIdle();
  assert('speech holds the head at centre, past the ten-second wait',
    Math.abs(spoke.yaw) < 0.2 && Math.abs(spoke.roll) < 0.2, JSON.stringify(spoke));
  DF.stop();
  await nap(50);

  DF.setIdleMotion(false);
  DF.disperse();
  for (let i = 0; i < 50; i++) T.tick(0.1);
  DF.start();
  for (let i = 0; i < 60; i++) T.tick(0.1);
  for (let i = 0; i < 40 / 0.05; i++) T.tick(0.05);
  const offPose = T.getIdle();
  assert('setIdleMotion(false) holds the head still',
    DF.idleMotion === false && Math.abs(offPose.yaw) < 0.02 && Math.abs(offPose.roll) < 0.02, JSON.stringify(offPose));
  DF.setIdleMotion(true);

  // ---- lip-sync DSP (pure, synthetic) ----
  const sr = 48000, n = 1024, half = n / 2;
  const mk = (amp, freq) => { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = amp * Math.sin(i * freq); return a; };
  const flatFd = new Float32Array(half); flatFd.fill(0);
  const loud = mk(0.5, 0.3), silent = new Float32Array(n), quiet = mk(0.02, 0.3);

  const r = T.computeMouth(loud, flatFd, sr, n, 0.016, 0);
  assert('loud -> mouth open', r.open > 0.3);
  const r2 = T.computeMouth(silent, flatFd, sr, n, 0.016, r.peak);
  assert('silence -> mouth closed', r2.open === 0);
  let pk = r.peak, openFinal = 0;
  for (let f = 0; f < 400; f++) { const rr = T.computeMouth(quiet, flatFd, sr, n, 0.016, pk); pk = rr.peak; openFinal = rr.open; } // ~6.4 s: enough for the 1.5 s peak release
  assert('adaptive gain: quiet recovers full gape', openFinal > 0.5);

  const bin = sr / n, lo1 = Math.floor(2000 / bin), hi1 = Math.floor(8000 / bin);
  const fdHi = new Float32Array(half), fdLo = new Float32Array(half);
  for (let i = 0; i < half; i++) { fdHi[i] = (i >= lo1 && i < hi1) ? 0 : -60; fdLo[i] = (i < lo1) ? 0 : -60; }
  const rHi = T.computeMouth(loud, fdHi, sr, n, 0.016, 0);
  const rLo = T.computeMouth(loud, fdLo, sr, n, 0.016, 0);
  assert('sibilant -> wide lips', rHi.width > 0.5);
  assert('vowel -> narrower lips', rLo.width < rHi.width);

  // ---- TTS wire format ----
  let captured = null;
  const realFetch = w.fetch;
  w.fetch = async (url, opts) => {
    captured = { url, opts };
    return {
      ok: true, status: 200,
      headers: { get: (h) => (h.toLowerCase() === 'content-type' ? 'application/json' : null) },
      async json() { return { audio_base64: 'AAAA' }; },
    };
  };
  DF.setEndpoint('http://tts.test/api');
  const buf = await T.requestTTS('hello world');
  assert('TTS POSTs JSON body', captured && captured.opts.method === 'POST' && captured.opts.body === JSON.stringify({ text: 'hello world', voice: 'default', response_format: 'wav' }));
  assert('TTS decodes base64 audio', buf && buf.byteLength === 3);

  // an OpenAI-compatible URL (vLLM, qwen3-tts deployments) takes the other shape
  DF.setEndpoint('http://tts.test/v1/audio/speech');
  DF.setModel('qwen3-tts');
  DF.setVoice('fresh');
  await T.requestTTS('say this');
  const oa = JSON.parse(captured.opts.body);
  assert('OpenAI endpoint sends {model,input,voice}',
    oa.model === 'qwen3-tts' && oa.input === 'say this' && oa.voice === 'fresh' && !('text' in oa));
  w.fetch = realFetch;

  // ---- voice fallback: a dead endpoint must still move the mouth, and say so ----
  // Under --dump-dom the rAF loop does not run, so real time is waited (for the fetch
  // rejection and the speechSynthesis guard) and frames are pumped by hand.
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pump = async (frames, dt) => { for (let i = 0; i < frames; i++) { T.tick(dt); await sleep(4); } };
  DF.setEndpoint('http://127.0.0.1:1/tts');   // nothing can be listening on port 1
  DF.speak('the quick brown fox jumps over the lazy dog, and keeps going a while');
  let fallbackPeak = 0;
  for (let i = 0; i < 12; i++) { await pump(4, 0.05); fallbackPeak = Math.max(fallbackPeak, T.getMouth().open); }
  assert('unreachable TTS still moves the mouth', fallbackPeak > 0.25);
  const vs = DF.voiceStatus();
  assert('status reports the fallback', vs.mode === 'simulated' && /no voice available/.test(vs.detail) && /127\.0\.0\.1|could not reach|connect/.test(vs.detail));
  DF.stop();
  await pump(30, 0.05);
  assert('stop() closes the mouth', T.getMouth().open < 0.1 && DF.voiceStatus().synthVoice === false);

  // ---- SSE parser: chunks can split anywhere, including inside a base64 payload ----
  const sse = [];
  const feed = T.parseSSE((name, data) => sse.push([name, data]));
  const doc = 'event: speech.audio.delta\ndata: {"type":"speech.audio.delta","audio":"AAAA"}\n\n' +
    'event: speech.audio.done\ndata: {"type":"speech.audio.done","usage":{}}\n\n';
  for (let i = 0; i < doc.length; i++) feed(doc[i]);           // one character at a time
  assert('SSE parser survives 1-byte chunks', sse.length === 2 &&
    sse[0][0] === 'speech.audio.delta' && sse[1][0] === 'speech.audio.done' &&
    sse[0][1] === doc.split('\n')[1].slice(6), JSON.stringify(sse.map((x) => x[0])));

  const sse2 = [];
  const feed2 = T.parseSSE((name, data) => sse2.push([name, data]));
  const crlf = 'event: speech.audio.delta\r\ndata: {"a":1}\r\n\r\nevent: speech.audio.done\r\ndata: {"b":2}\r\n\r\n';
  feed2(crlf.slice(0, 25)); feed2(crlf.slice(25, 27)); feed2(crlf.slice(27)); feed2.flush();  // split inside the CRLFCRLF
  assert('SSE parser handles CRLF split across chunks', sse2.length === 2 && sse2[1][1] === '{"b":2}', JSON.stringify(sse2));

  const noData = [];
  const feed3 = T.parseSSE((n, d) => noData.push([n, d]));
  feed3(': keep-alive\n\nevent: ping\n\ndata: {"x":1}\n\n');
  assert('SSE parser ignores comments and data-less events', noData.length === 1 && noData[0][1] === '{"x":1}', JSON.stringify(noData));

  const i16 = T.int16FromBase64(btoa(String.fromCharCode(0, 0, 0x00, 0x80, 0xff, 0x3f)));
  assert('base64 decodes to little-endian s16', i16[0] === 0 && i16[1] === -32768 && i16[2] === 16383 && i16.length === 3,
    JSON.stringify([...i16]));
  assert('voices URL is derived from the endpoint',
    T.voicesUrlFor('http://h:8091/v1/audio/speech') === 'http://h:8091/v1/audio/voices' &&
    T.voicesUrlFor('http://h:8091/tts/speak') === 'http://h:8091/v1/audio/voices', T.voicesUrlFor('http://h:8091/tts/speak'));

  // ---- streaming sink: schedule, play, stop ----
  // Whether an AudioContext exists depends on how Chromium was launched: under
  // --dump-dom there is none, so playback is asserted in check:voice and only the
  // safe-degradation path can be asserted here.
  const tone = (secs, amp) => { const n = (24000 * secs) | 0; const a = new Int16Array(n); for (let i = 0; i < n; i++) a[i] = Math.round(Math.sin(i * 0.08) * amp * 32767); return a; };
  DF.stop();
  const sink = T.getVoiceStream(24000);
  const clockBefore = T.getAudioClock();
  // let the real audio thread get moving before judging whether it renders at all
  await new Promise((r) => setTimeout(r, 300));
  let threw = null;
  try {
    sink.push(tone(0.4, 0.5));
    await pump(6, 0.03);
    let streamPeak = 0;
    for (let i = 0; i < 8; i++) { sink.push(tone(0.25, 0.5)); await pump(4, 0.02); streamPeak = Math.max(streamPeak, T.getMouth().open); }
    sink.end();
    const clock = T.getAudioClock();
    // an AudioContext that exists but never advances is what --dump-dom gives you:
    // the graph is scheduled, the audio thread is not running. Assert what can run.
    const renders = clock && clock.state === 'running' && clock.t - (clockBefore ? clockBefore.t : 0) > 0.05;
    if (renders) {
      assert('streamed PCM plays and moves the mouth',
        streamPeak > 0.3 && DF.voiceStatus().audioActive === true && DF.getState() === 'speaking',
        `${streamPeak} ${JSON.stringify(clock)}`);
    } else {
      assert('stream sink is safe when audio cannot render', DF.voiceStatus().audioActive === false, 'audio clock frozen: ' + JSON.stringify(clock));
    }
  } catch (e) {
    threw = String((e && e.message) || e);
    assert('stream sink did not throw', false, threw);
  }
  DF.stop();
  assert('stop() silences a stream', DF.voiceStatus().audioActive === false, JSON.stringify(DF.voiceStatus()));

  render();
}

function render() {
  const pass = results.filter((r) => r.pass).length;
  const html = results.map((r) => (r.pass ? 'PASS' : 'FAIL') + '  ' + r.name + (r.pass || !r.detail ? '' : '  :: ' + r.detail)).join('\n') +
    '\n\n' + pass + '/' + results.length + ' PASS';
  const out = document.getElementById('out');
  out.textContent = html;
  document.title = pass + '/' + results.length + ' PASS';
}

main().catch((e) => {
  const out = document.getElementById('out');
  out.textContent = 'ERROR: ' + ((e && e.stack) || e);
  document.title = 'ERROR';
});
</script>
</body>
</html>
